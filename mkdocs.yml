site_name: GP system specification archive
site_description: An unofficial historical archive of GP clinical system specifications, focused on NHS England with other jurisdictions for comparison.
site_url: https://ohtf.github.io/gp-system-spec/
repo_url: https://github.com/ohtf/gp-system-spec
repo_name: ohtf/gp-system-spec
docs_dir: site/source
site_dir: site/archive
copyright: >-
  Hosted by the <a href="https://openhealthtechnology.org/">Open Health Technology Foundation</a>.<br>
  Archive commentary and OHTF branding are <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
  Captured material retains its original rights and notices.

nav:
  - Home: index.md
  - GP IT Futures capabilities: capabilities.md
  - Implementation reference: implementation-reference.md
  - NHS standards and collections: nhs-england.md
  - Compare with Ireland: ireland.md
  - Historical sources: historical-sources.md
  - About the archive: about.md

# Captured documents, spec extracts and the OCR transcript have collection indexes.
not_in_nav: |
  nhs-snapshot/**
  implementation-reference/**
  rcgp-1980/transcript.md

# Zensical 0.1.2 can report valid punctuation-bearing Confluence IDs as missing.
# s/linkcheck validates fragments against actual HTML IDs on every rendered page.
validation:
  links:
    anchors: ignore

theme:
  variant: modern
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/ohtf-avatar.svg
  logo: assets/ohtf-avatar.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode

extra_css:
  - stylesheets/ohtf.css
  - stylesheets/extra.css

extra:
  generator: false
